# Runnable iOS app around Sources/. Regenerate the Xcode project after editing:
#   cd apps/ios-client && xcodegen generate
# Package.swift stays as the library + unit-test entry point for the same Sources.
name: PosturePulse
options:
  bundleIdPrefix: com.beaive
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: 3J5T92268T
targets:
  PosturePulse:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: AppResources
    dependencies:
      - package: SocketIO
    info:
      path: AppResources/Info.plist
      properties:
        CFBundleDisplayName: PosturePulse AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # Full screen on iPad: a camera assessment should not run in Split View.
        UIRequiresFullScreen: true
        # HTTPS only - exempt encryption, so TestFlight skips the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: PosturePulse AI records short video clips during an assessment to estimate your posture. Clips are sent to your clinic's PosturePulse server and deleted after analysis, unless you chose to keep session video.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beaive.posturepulse
        # Same module name as the Package.swift library so Tests/ can `@testable import` either.
        PRODUCT_MODULE_NAME: PostureAnalysisClient
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  PosturePulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: PosturePulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beaive.posturepulse.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PosturePulse:
    build:
      targets:
        PosturePulse: all
        PosturePulseTests: [test]
    test:
      targets:
        - PosturePulseTests
