# Shared-host overrides for infra/docker-compose.yml (docs/adr/016-shared-host-nginx.md).
# The host's own nginx terminates TLS for posture.beaive.com and proxies to
# backend-api on 127.0.0.1:3100. Nothing else is published; other projects on
# the host keep their ports. Secrets come from infra/.env (root/owner-only):
#   POSTGRES_PASSWORD=...   JWT_SECRET=...   PATIENT_DATA_KEY=...
# PATIENT_DATA_KEY is 32 random bytes, base64 (openssl rand -base64 32). Back it up
# separately from the database: without it the patient register cannot be read.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.server.yml \
#     --env-file infra/.env up -d --build
name: posturepulse

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }

  # Not used by any code path (ADR-003); kept out of the shared host.
  redis:
    profiles: ["unused"]

  ml-service:
    ports: !reset []
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }

  backend-api:
    ports: !override
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://beaive:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/beaive
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      PATIENT_DATA_KEY: ${PATIENT_DATA_KEY:?set PATIENT_DATA_KEY in infra/.env}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
