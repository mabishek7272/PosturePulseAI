# Host nginx site for posture.beaive.com (docs/adr/016-shared-host-nginx.md).
# Install: copy to /etc/nginx/sites-available/, symlink into sites-enabled,
# `nginx -t`, reload, then `certbot --nginx -d posture.beaive.com` adds TLS.
# Sites-enabled files are included in the http context, so the zone is declared here.
limit_req_zone $binary_remote_addr zone=posturepulse_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name posture.beaive.com;

    # Assessment clips (M1) are uploaded through this host.
    client_max_body_size 100m;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        limit_req zone=posturepulse_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
